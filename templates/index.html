<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    h1 { margin-bottom: 4px; }
    p.total { font-size: 1.2rem; color: #333; margin-bottom: 24px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    form input, form select { padding: 8px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    form input[name="title"] { flex: 1; min-width: 140px; }
    form button { padding: 8px 16px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eee; }
    th { background: #f5f5f5; }
    a.del { color: red; text-decoration: none; font-size: 0.9rem; }
    a.del:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>💸 Expense Tracker</h1>
  <p class="total">Total spent: <strong>₹{{ "%.2f"|format(total) }}</strong></p>

  <form action="/add" method="POST">
    <input type="text"   name="title"    placeholder="What did you spend on?" required>
    <input type="number" name="amount"   placeholder="Amount" step="0.01" min="0" required>
    <select name="category">
      <option>Food</option>
      <option>Transport</option>
      <option>Shopping</option>
      <option>Health</option>
      <option>Bills</option>
      <option>Other</option>
    </select>
    <button type="submit">Add</button>
  </form>

  {% if expenses %}
  <table>
    <thead>
      <tr><th>Title</th><th>Category</th><th>Amount</th><th></th></tr>
    </thead>
    <tbody>
      {% for e in expenses %}
      <tr>
        <td>{{ e.title }}</td>
        <td>{{ e.category }}</td>
        <td>₹{{ "%.2f"|format(e.amount) }}</td>
        <td><a class="del" href="/delete/{{ e._id }}">Delete</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
    <p>No expenses yet. Add one above!</p>
  {% endif %}

</body>
</html>
